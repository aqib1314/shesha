<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shisha Cafe</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:20px}
.card{background:#222;padding:20px;border-radius:15px;margin:15px}
button{background:#ff9800;border:none;padding:15px 25px;border-radius:10px;font-size:18px;margin:5px;font-weight:bold}
</style>
</head>
<body>
<h1>🔥 Shisha Cafe</h1>
<h2 id="table">Loading...</h2>
<div class="card">
<h3>Flavour Select Karo</h3>
<button onclick="order('Double Apple')">Double Apple</button>
<button onclick="order('Mint')">Mint</button>
<button onclick="order('Blueberry')">Blueberry</button>
</div>
<div class="card">
<button onclick="order('Coal Refresh')">🔥 Coal Refresh</button>
<button onclick="order('Bill Chahiye')">🧾 Bill</button>
<button onclick="order('Help Chahiye')">🆘 Help</button>
</div>
<h3 id="msg"></h3>
<script>
let t = new URLSearchParams(location.search).get('t') || '1';
document.getElementById('table').innerText = 'Table No: ' + t;
function order(item){
document.getElementById('msg').innerText = '✅ Order mil gaya! Table '+t+' - '+item;
}
</script>
</body>
</html>
